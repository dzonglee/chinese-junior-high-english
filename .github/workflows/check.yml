name: Check the English app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  learner-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:local
      - run: npm run check
      - run: npm run test:grammar
      - run: npm run content:audit
      - run: npm run check:course
      - run: npm run check:interactions
      - run: npm run check:teaching
      - run: npm run check:package
      - run: npm run test:native-adapter
      - run: npm run test:native-cancellation
      - run: npm run test:release-guards
      - run: npx playwright install --with-deps chromium
      - run: npm run test:journeys
      - run: npm run test:local
      - run: npm run test:course-browser
      - run: npm run test:interactions
      - run: npm run test:teaching
      - run: node scripts/test-teaching-transfers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-journey-evidence
          path: |
            test-results/journeys/
            test-results/local/
            test-results/course/
            test-results/interactions/
            test-results/teaching/
            test-results/teaching-actions/
            test-results/teaching-transfers/
      - uses: actions/upload-artifact@v4
        with:
          name: local-english-app
          path: dist/local/
