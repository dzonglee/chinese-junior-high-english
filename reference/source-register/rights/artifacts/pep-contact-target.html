        function post_searchword () {
          var getval = document.getElementById("searchword").value;
          if (getval == "" || getval == "关键词") {
            alert("关键词不能为空");
          } else {
            getval = unescape(getval);
            var containSpecial = RegExp(/[(\~)(\!)(\@)(\#)(\$)(\%)(\^)(\&)(\*)(\()(\))(\-)(\_)(\+)(\=)(\[)(\])(\{)(\})(\|)(\\)(\;)(\:)(\')(\")(\,)(\.)(\/)(\<)(\>)(\?)(\)]+/);
            if (containSpecial.test(getval)) {
              //alert("关键词里面不能含有特殊字符");
              alert("您搜索的关键词中包含以下不可搜索字符:\~\!\@\#\$\%\^\&\*\(\)\-\_\+\=\[\]\{\}\|\\\:\'\"\,\.\/\<\>\? 请修改后再进行搜索");
              return;
            }
            document.location.href = "/search/searchvaluefrowas/?searchword=" + encodeURIComponent(getval);
          }
        }

        function onKeyDownSearch (event) {
          if (window.event) {  // IE8 以及更早版本
            if (event.keyCode == 13) {
              post_searchword();
            }
          } else if (event.which) { // IE9/Firefox/Chrome/Opera/Safari
            if (event.which == 13) {
              post_searchword();
            }
          }
        }

var currentPage = 0;//所在页从0开始

var countPage = 1//共多少页

	document.write("<a href=\"index"+"_" + prevPage + "."+"shtml\" class='disabled'>上一页</a>");

	document.write("<a href=\"index.shtml\" class='disabled'>上一页</a>");

//循环
var num = 6;
for(var i=0+(currentPage-1-(currentPage-1)%num) ; i<=(num+(currentPage-1-(currentPage-1)%num))&&(i<countPage) ; i++){
	if(currentPage==i)
		document.write("<span class='current'>"+(i+1)+"</span>");
	else if(i==0)
		document.write("<a href=\"index.shtml\">"+(i+1)+"</a>");
	else
		document.write("<a href=\"index"+"_" + i + "."+"shtml\">"+(i+1)+"</a>");          

}
if(i>(num+(currentPage-(currentPage-1)%num))){
document.write("<span style='line-height:15px;'>...</span>");
document.write("<a href=\"index"+"_" + (countPage-1) + "."+"shtml\">"+countPage+"</a>");
}

//设置下一页代码

	document.write("<a href=\"index"+"_" + nextPage + "."+"shtml\" class='disabled'>下一页</a>");
else

//跳转页面

		             "&nbsp;&nbsp;<a href='#' onclick='javacript:toPage()'>GO</a>");
	             
function toPage(){
	var _num = document.getElementById("num").value;
	if(isNaN(_num)){
		alert("请输入数字");
		return false;
	}
	var str = "index"+"_"+(_num-1)+"."+"shtml";
	var url = location.href.substring(0,location.href.lastIndexOf("/")+1);
	if(_num<=1||_num==null)
		location.href = url+"index"+"."+"shtml";
	else if(_num>countPage)
		alert("本频道最多"+countPage+"页");
	else
		location.href = url+str;
}
