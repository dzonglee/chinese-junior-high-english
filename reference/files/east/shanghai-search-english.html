	<script>
		jQuery(document).ready(function() {
			Main.init();
		});
	</script>
	<script>
	
		var pageSize = 10;
		var pageIndex = 0;
		jQuery(document).ready(function() {
			Main.init();
			var keywords = jQuery("#keywords").val();
			if( keywords!='' ){
				searchCheck(true);
			}
			
			$("input[name='field']").change(function() {
				searchCheck(true);
			});
			
			$("input[name='rang']").change(function() {
				searchCheck(true);
			});

			jQuery("#search").click(function() {
				
				searchCheck(true);
			});
		}); 

		function searchCheck(clean) {
			if(clean){
				pageSize = 10;
				pageIndex = 0;
			}
			var keywords = jQuery("#keywords").val();
			console.log(keywords);
			if (keywords == null || keywords == "") {
				return;
			}
			var rang = $("input[name='rang']:checked").val();
			console.log(rang);

			var field = $("input[name='field']:checked").val();
			console.log(field);

			var data = {
				'rang' : rang,
				'form' : pageSize * pageIndex,
				'size' : pageSize,
				'field' : field,
				'keywords' : keywords
			};

			console.log(data);

			$.post("/jkysearch/page/jky_search/search", data,
					function(ob) {
						var data = ob.data;
						console.log(data); //  2pm
						jQuery("#resultMessage").html(
								"为您找到" + data.count + "条结果");

						jQuery("#result-list").html("");
						jQuery.each(data.beans, function(n, bean) {
							jQuery("#result-list").append(formartBean(bean));

						});

						jQuery(".tcdPageCode").createPage({
							pageCount : Math.ceil(data.count / pageSize),
							current : pageIndex + 1,
							backFn : function(p) {
								pageIndex = p - 1;
								searchCheck();
							}
						});

					}, "json");

		}

			function escapeHtml(text) {
				if (!text) return "";
				var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
				return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
			}
		
			function sanitizeHighlight(html) {
				if (!html) return "";
				// Only allow <em> and </em> tags (used by Elasticsearch for highlighting)
				// Strip all other HTML tags to prevent XSS
				html = html.replace(/<(?!\/?(?:em)\b)[^>]*>/gi, '');
				// Remove any event handlers
				html = html.replace(/\son[a-z]+\s*=/gi, '');
				return html;
			}
		
			function formartBean(bean) {
			console.log(bean);
			var page = jQuery.parseJSON(bean.source);

			var title = escapeHtml(page.title);
			var body = (page.txt == null) ? "" : escapeHtml(page.txt);

			if (bean.highlightFields.title != null) {
				title = sanitizeHighlight(bean.highlightFields.title);
			}

			if (bean.highlightFields.txt != null) {
				body = sanitizeHighlight(bean.highlightFields.txt);
			}

			var sb = new StringBuilder(); //指定&&为分隔符
			

			sb.Append('<li><div class="brief"><h4 class="title ">');
			sb.Append("<a href='"+page.url+"' target='_blank' >");
			sb.Append(title);
			sb.Append("</a></h4>");
			sb.Append("<p>" + body + "...</p>");
			
			sb.Append('<div class="row search-url"><div class="col-xs-8 nowrap">'  + page.url + ' </div><div class="col-xs-4 text-right">'
					+ page.releaseDate.substring(0,10) + "</div></div></div>");
			sb.Append('</li> ');

			return sb.ToString()
		}

		 
	</script>
	<script>
		jQuery(document).ready(function() {
		
			//dotdotdot.js
			$('.brief p').dotdotdot({
				watch: 'window'
			});
		});
