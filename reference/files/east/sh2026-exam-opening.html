        <h2> 
          <div id="ivs_title">2026年上海市初中学业水平考试平稳开考 
              <small class="PBtime" style="margin-top: 0px">2026-06-20 10:40:57</small>
          </div>  
<div id="ivs_player"></div>
        </h2>
        <!-- 正文 -->
        <div id="ivs_content" class="Article_content">
<div id="ivs_content">          
<p>

   <p style="margin-top:0;margin-right:0;margin-bottom:0;margin-left:0;text-indent:40px;text-autospace:ideograph-numeric;text-align:justify;text-justify:inter-ideograph;line-height:35px;background:rgb(255,255,255)"><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">2026</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px"><span style="font-family:仿宋_GB2312">年上海市初中学业水平考试于</span><span style="font-family:仿宋_GB2312">6月</span></span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">20</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">日至</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">21</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px"><span style="font-family:仿宋_GB2312">日举行。全市共设</span><span style="font-family:仿宋_GB2312">16个考区、2</span></span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">14</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">个考点、</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">4730</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px"><span style="font-family:仿宋_GB2312">个考场，约</span><span style="font-family:仿宋_GB2312">1</span></span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">3</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">.</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">8</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">万考生参加考试。</span></p><p style="margin-top:0;margin-right:0;margin-bottom:0;margin-left:0;text-indent:40px;text-autospace:ideograph-numeric;text-align:justify;text-justify:inter-ideograph;line-height:35px;background:rgb(255,255,255)"><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">为保障考试顺利</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">，全市教育</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">行政和考试</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">部门</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">严格落实各项</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">考务组织</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">要求</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">，</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">压实</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">各方</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">责任，</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">严防</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">考试</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">舞弊</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">。市、区两级</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">公安、卫生、</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">通信、</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">市监、生态、水务、电力、应急等多部门</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">统筹协作，</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">形成保障合力，</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">为广大考生</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">营造</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">良好</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">的考试环境。</span></p><p style="margin-top:0;margin-right:0;margin-bottom:0;margin-left:0;text-indent:40px;text-autospace:ideograph-numeric;text-align:justify;text-justify:inter-ideograph;line-height:35px;background:rgb(255,255,255)"><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">目前，语文科目考试已顺利结束，各考区、考点有序平稳。</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px">2026</span><span style="font-family: 仿宋_GB2312;color: rgb(51, 51, 51);letter-spacing: 0;font-size: 20px"><span style="font-family:仿宋_GB2312">年上海市初中学业水平考试语文科目写作题目如下</span><span style="font-family:仿宋_GB2312">——</span></span></p><p style="text-align: center;"><img src="/resource/upload/www/202606/20104014r7em.png" title="20104014r7em.png" alt="20104014r7em.png" width="550" height="180" border="0" vspace="0" style="width: 550px; height: 180px;"/></p>
