<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>同步资源</title>
    <link rel="stylesheet" href="css/public.css">
    <link rel="stylesheet" href="css/resource.css">
    <link rel="stylesheet" href="css/zTreeStyle/zTreeStyle.css">
    <script src="js/plugins/jquery/jquery.min.js"></script>
    <script src="js/plugins/jquery.LoadImage.js"></script>
    <script src="js/lib/baseURL.js"></script>
    <script src="js/resourceTeacher.js"></script>
    <script src="js/resourceInsideAuthor.js"></script>
    <script src="js/resource.js"></script>
    <script src="js/public.js"></script>
    <script type="text/javascript" src="js/includePage.js" id="pageScript" data="page=4"></script>
    <script src="js/lib/zTree/jquery.ztree.core.js"></script>
    <script src="js/lib/zTree/jquery.ztree.exedit.js"></script>



    <!--<script src="mock-min.js"></script>-->
</head>
<body>
<div id="container">
    <!--header-->
    <div id="vheader"></div>
    <!--header-->
    <div class="maincontent">
        <!--左侧-->
        <div class="lft">
            <div class="school">
                <dl>
                    <dt>
                        <span class="fl">分类:</span>
                        <span id="section_value" class="fl"></span>
                        <input type="hidden" id="sectionId">
                        <span class="fr btn_change">更改</span>
                    </dt>
                    <dd id="class_section" class="classification">
                        <ul id="section">
                        </ul>
                    </dd>
                </dl>
                <dl>
                    <dt>
                        <span class="fl">学科:</span>
                        <span id="subject_value" class="fl"></span>
                        <input id="subject_value_hidden" type="hidden" class="fl"/>
                        <input type="hidden" id="subjectId">
                        <span class="fr btn_change">更改</span>
                    </dt>
                    <dd id="class_subject" class="classification">
                        <ul id="subject">
                        </ul>
                    </dd>
                </dl>
            </div>
            <div class="tabSwitch">
                <ul class="tabs">
                    <!--<li><a id="AUT" href="resourceTeaching.html">教材介绍</a></li>
                    <li><a id="TINT" href="resourceAuthor.html">作者介绍</a></li>-->
                    <!--<li><a id="SUB" href="resourceSubject.html">学科教研</a></li>-->
                    <li class="cur"><a id="SYN" href="resource.html">同步资源</a></li>
                </ul>
                <div class="node clear">
                    <ul id="tree" class="ztree"></ul>
                </div>
            </div>
        </div>
        <!--左侧-->
        <!--右侧-->
        <div class="rht">
            <div class="selectTop">
                <dl>
                    <dt>类别</dt>
                    <dd id="category" class="slct">
                        <span class="selected">不限</span>
                    </dd>

                </dl>
                <dl class="geshi">
                    <dt>格式</dt>
                    <dd id="format" class="slct">
                        <span class="selected">不限</span>
                    </dd>
                </dl>
                <dl class="zhishidian">
                    <dt>知识点</dt>
                    <dd class="slct">
                        <div class="choseBrdr">
                        </div>
                        <div id="knowledge" class="choseSlct">
                            <span class="selected" data-value="" data-name="不限" deep="1">不限</span>
                        </div>
                    </dd>
                </dl>
                <dl class="nianfen">
                    <dt>年份</dt>
                    <dd id="yearmonth" class="slct">
                        <span class="selected">不限</span>
                    </dd>
                </dl>
            </div>
            <div class="selectBrdr">
                <div class="selectLft">
                    <ul class="orderBy">
                        <li >
                            <div class="selectTit">排序<span>|</span></div>
                            <span id="time">最新</span>
                            <span id="view">浏览量</span>
                            <span id="downclick">下载量</span>
                        </li>
                        <li >
                            <div class="selectTit">价格<span>|</span></div>
                            <span id="price_all">不限</span>
                            <span id="price_free">免费</span>
                            <span id="price_cost">收费</span>
                        </li>
                    </ul>
                </div>
            </div>
            <!--同步资源列表-->
            <div id="home" class="listItem" >
                <ul id="datalist" class="wrap_list clear">

                </ul>
                <div id="paper" class="pages clear">
                    <div id="pageInfo">

                    </div>
                </div>
            </div>
            <!--教室介绍-->
            <div class="listItem" id="dateTeacher" style="display: none">
                <ul id="datalistTeacher" class="wrap_list2 clear">

                </ul>
                <div id="paperTeacher" class="pages clear">
                    <div id="pageInfoTeacher">

                    </div>
                </div>
            </div>
            <!-- 作者介绍-->
            <div class="listItem" id="dateAuthor" style="display: none">
                <ul id="datalistAuthor" class="newslist wrap_author">

                </ul>
                <div id="paperAuthor" class="pages clear">
                    <div id="pageInfoAuthor">

                    </div>
                </div>
            </div>
        </div>
        <!--右侧-->
    </div>
    <!--footer-->
    <div id="layout_footer"></div>
    <!--footer-->
</div>
<div id="vfooter"></div>
<script src="js/statistics.js"></script></body>
</html>
