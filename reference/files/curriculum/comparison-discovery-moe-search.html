<script>
    function Link(site_code) {
        //获取该站点需要纠错页面的url地址
        var url = getCurrUrl();
        //跳转至纠错系统填写页面
        //20190701测试修改  window.open("http://121.43.68.40/exposure/jiucuo.html?site_code=" + site_code + "&url=" + encodeURIComponent(url));
        window.open("https://zfwzgl.www.gov.cn/exposure/jiucuo.html?site_code=" + site_code + "&url=" + encodeURIComponent(url));
    }

    //获取该站点需要纠错页面的url地址
    function getCurrUrl() {
        var url = "";
        if (parent !== window) {
            try {
                url = window.top.location.href;
            } catch (e) {
                url = window.top.document.referrer;
            }
        }
        if (url.length == 0)
            url = document.location.href;

        return url;
    }

<script>
    function tabclick(db) {
        var url = "index?tab=" + db + "&siteCode=bm05000001";
        location.href = url;
    }

    function gosearch() {
        var qt = document.getElementById("qt").value;
        if (qt == null || qt == "") {
            alert("检索词不能为空");
        } else {
            $("#queryForm").submit();
        }
    }

    function hot(word) {
        var url = "s?tab=all&siteCode=bm05000001&qt=" + encodeURIComponent(word);
        window.open(getDomainPath() + url, "_self")
    }

    function getDomainPath() {
        var href = location.href;
        if (href.indexOf('?') != -1) {
            href = href.substring(0, href.lastIndexOf('?'))
        }
        if (!href.endsWith('/')) {
            href += '/'
        }
        return href;
    }


    $(function () {
        if (typeof String.prototype.startsWith !== 'function') {
            String.prototype.startsWith = function (prefix) {
                return this.slice(0, prefix.length) === prefix;
            };
        }

        if (typeof String.prototype.endsWith !== 'function') {
            String.prototype.endsWith = function (suffix) {
                return this.indexOf(suffix, this.length - suffix.length) !== -1;
            };
        }
    })

</script>

                } else {

                }
                holdPosition = 0, mySwiperNavTimer = null;
            },
            onTouchStart: function (swiper) {
                holdPosition = 0, clearTimeout(mySwiperNavTimer);
            },
            onTouchEnd: function (swiper) {
                if (holdPosition != 0) {
                    $('#m_nav_mask_fun').hide();
                    mySwiperNavTimer = setTimeout(function () {
                        $('#m_nav_mask_fun_left').stop().fadeIn();
                    }, 1000)
                } else {
                    mySwiperNavTimer = setTimeout(function () {
                        $('#m_nav_mask_fun').stop().fadeIn();
                    }, 1000)
                    $('#m_nav_mask_fun_left').hide();
                }
            },
            onResistanceAfter: function (swiper, pos) {
                holdPosition = pos
            }
        })

        function topNavFun() {
            if ($(window).scrollTop() >
                ($('.m_tou_date').height() + $('.m_top_logo').height())
            ) {

                if (!$('.swiper_container_top_nav').hasClass('fixed')) {
                    $('.swiper_container_top_nav').addClass('fixed');
                }
            } else if (
                $(window).scrollTop() <=
                ($('.m_top_logo').height())
            ) {

                if ($('.swiper_container_top_nav').hasClass('fixed')) {
                    $('.swiper_container_top_nav').removeClass('fixed');
                }
            }
        }

        // topNavFun();
        $(window).scroll(function () {
            topNavFun();
        });

    }
